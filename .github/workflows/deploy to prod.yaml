name: Deploy to api.groundfloor-app.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.MEDIA_SSH }}
    
      - name: Upload application
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.git/' \
            --exclude '.cache/' \
            --exclude 'build/' \
            --exclude 'node_modules/' \
            --exclude 'public/uploads/' \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            ./ ubuntu@37.187.76.75:/home/ubuntu/projets/ground-floor-api/

      - name: Build and restart production service
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=60 ubuntu@37.187.76.75 <<'ENDSSH'
          set -e
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          cd /home/ubuntu/projets/ground-floor-api
          nvm install 18
          nvm use 18
          yarn --frozen-lockfile
          yarn build
          pm2 restart "ground-floor-api" --update-env
          ENDSSH
