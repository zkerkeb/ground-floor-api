
name: Deploy to media.hikkary.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.MEDIA_SSH }}
    
      - name: Upload application
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.git/' \
            --exclude '.cache/' \
            --exclude 'build/' \
            --exclude 'node_modules/' \
            --exclude 'public/uploads/' \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            ./ hikkary@media.hikkary.com:/home/hikkary/projet/ground-floor-api/

      - name: Build and restart development service
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=60 hikkary@media.hikkary.com <<'ENDSSH'
          set -e
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          cd /home/hikkary/projet/ground-floor-api
          nvm install 18
          nvm use 18
          yarn --frozen-lockfile
          yarn build
          npx --yes pm2@5.4.3 restart "ground-floor-api" \
            --interpreter "$(command -v node)" \
            --update-env
          ENDSSH
